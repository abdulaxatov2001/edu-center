<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O'quvchilar — Muhfillo Edu Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="../index.html" class="nav-logo"><div class="logo-icon"><svg width="28" height="28" viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="8" fill="url(#sLG2)"/><path d="M8 14L12 18L20 10" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="sLG2" x1="0" y1="0" x2="28" y2="28"><stop stop-color="#10B981"/><stop offset="1" stop-color="#3B82F6"/></linearGradient></defs></svg></div><span class="logo-text">Muhfillo <span class="logo-accent">Edu</span></span></a>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="sidebar-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Dashboard</a>
            <a href="tests.html" class="sidebar-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Testlar</a>
            <a href="students.html" class="sidebar-link active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>O'quvchilar</a>
            <a href="analytics.html" class="sidebar-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>Analitika</a>
            <div class="sidebar-divider"></div>
            <a href="../index.html" class="sidebar-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>Reyting</a>
        </nav>
        <div class="sidebar-footer">
            <div class="sidebar-user"><div class="user-avatar">A</div><div class="user-info"><span class="user-name" id="userName">Admin</span><span class="user-role" id="userRole">Administrator</span></div></div>
            <button class="btn-logout" id="logoutBtn" title="Chiqish"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
        </div>
    </aside>

    <main class="main-content" id="mainContent">
        <header class="content-header">
            <button class="sidebar-toggle" id="sidebarToggle" aria-label="Menyu"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
            <div class="header-title"><h1>O'quvchilar</h1><p class="header-subtitle">O'quvchilar ro'yxatini boshqaring</p></div>
            <div style="display: flex; gap: 8px;">
                <button class="btn btn-outline" id="manageGroupsBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    Guruhlar boshqaruvi
                </button>
                <button class="btn btn-outline" id="addTeacherBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    O'qituvchi qo'shish
                </button>
                <button class="btn btn-primary" id="addStudentBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
                    O'quvchi qo'shish
                </button>
            </div>
        </header>

        <div class="content-body">
            <div class="filters-bar" style="margin-bottom: 1.5rem;">
                <div class="filter-group">
                    <label class="filter-label">Guruh:</label>
                    <select class="filter-select" id="filterGroup"><option value="all">Barcha guruhlar</option></select>
                </div>
                <div class="search-box">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" class="search-input" id="searchStudent" placeholder="O'quvchi qidirish...">
                </div>
            </div>

            <div class="table-wrapper">
                <table class="data-table" id="studentsTable">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Ism Familiya</th>
                            <th>Guruh</th>
                            <th>Telefon</th>
                            <th>Qo'shilgan</th>
                            <th>Amallar</th>
                        </tr>
                    </thead>
                    <tbody id="studentsTableBody"></tbody>
                </table>
                <div class="empty-state" id="studentsEmpty" style="display:none;">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
                    <p>O'quvchilar topilmadi</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Add Student Modal -->
    <div class="modal-overlay" id="studentModal" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="studentModalTitle">O'quvchi qo'shish</h2>
                <button class="modal-close" id="studentModalClose">&times;</button>
            </div>
            <div class="modal-body">
                <form id="studentForm">
                    <div class="form-group">
                        <label class="form-label">Ism Familiya</label>
                        <input type="text" class="form-input" id="studentName" placeholder="To'liq ism" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Guruh</label>
                            <select class="form-input" id="studentGroup" required>
                                <option value="">Guruhni tanlang...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Telefon</label>
                            <input type="tel" class="form-input" id="studentPhone" placeholder="+998 90 123 45 67">
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-ghost" id="studentModalCancel">Bekor qilish</button>
                <button type="button" class="btn btn-primary" id="saveStudentBtn">Saqlash</button>
            </div>
        </div>
    </div>

    <!-- Groups (Guruhlar) Management Modal -->
    <div class="modal-overlay" id="groupsModal" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">Guruhlar boshqaruvi</h2>
                <button class="modal-close" id="groupsModalClose">&times;</button>
            </div>
            <div class="modal-body">
                <form id="newGroupForm" style="display: flex; gap: 8px; margin-bottom: 1.5rem;">
                    <input type="text" class="form-input" id="newGroupName" placeholder="Yangi guruh nomi (masalan: 10-A guruh)" required style="flex: 1;">
                    <button type="submit" class="btn btn-primary" id="addGroupBtn">Qo'shish</button>
                </form>

                <div style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 8px;">Mavjud guruhlar:</div>
                <div id="groupsList" style="display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto;">
                    <!-- Dinamik guruhlar ro'yxati -->
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-ghost" id="groupsModalOk">Yopish</button>
            </div>
        </div>
    </div>

    <!-- Teacher Account Modal -->
    <div class="modal-overlay" id="teacherModal" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">O'qituvchi qo'shish</h2>
                <button class="modal-close" id="teacherModalClose">&times;</button>
            </div>
            <div class="modal-body">
                <form id="teacherForm">
                    <div class="form-group">
                        <label class="form-label">To'liq ism</label>
                        <input type="text" class="form-input" id="teacherName" placeholder="O'qituvchi ismi" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Login</label>
                            <input type="text" class="form-input" id="teacherLogin" placeholder="Masalan: teacher1" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Parol</label>
                            <input type="text" class="form-input" id="teacherPassword" placeholder="Kamida 6 belgi" required>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-ghost" id="teacherModalCancel">Bekor qilish</button>
                <button type="button" class="btn btn-primary" id="saveTeacherBtn">Saqlash</button>
            </div>
        </div>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/admin-students.js"></script>
</body>
</html>
